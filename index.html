<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5c518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estoque">
<title>Estoque de Celulares</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--bg4:#282828;
  --border:#2a2a2a;--border2:#333;
  --text:#f2ede4;--text2:#888;--text3:#444;
  --accent:#f5c518;--green:#00e676;--green2:rgba(0,230,118,.1);
  --red:#ff5252;--red2:rgba(255,82,82,.1);
  --r:8px;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:999;transition:opacity .3s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-logo{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.15em}

/* APP */
.app{max-width:720px;margin:0 auto;padding:0 0 6rem}
header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 1.25rem}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--accent);text-transform:uppercase;line-height:1.2}
.logo small{display:block;color:var(--text3);font-weight:400;font-size:10px;letter-spacing:.1em;margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--text2);font-family:var(--mono);transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-icon:hover{background:var(--bg3);color:var(--text)}
.btn-icon.logado{border-color:var(--accent);color:var(--accent)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;flex-shrink:0}
.sync-dot.off{background:var(--text3);box-shadow:none;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:1.25rem 1.25rem .5rem}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem}
.stat-n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.stat-l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}

/* TABS */
.tabs{display:flex;gap:4px;padding:.75rem 1.25rem .25rem;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;font-size:13px;font-family:var(--mono);color:var(--text3);cursor:pointer;border-radius:6px;transition:all .15s;border:none;background:none}
.tab.active{color:var(--accent);background:rgba(245,197,24,.08)}

/* TOOLBAR */
.toolbar{padding:.75rem 1.25rem;display:flex;gap:10px}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px 10px 36px;font-size:14px;color:var(--text);font-family:var(--sans);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text3)}
.s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}

/* FAB */
.fab{position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom,0));right:1.5rem;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;border:none;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(245,197,24,.35);transition:all .15s;z-index:60}
.fab:hover{transform:scale(1.08)}
.fab:active{transform:scale(.95)}

/* LIST */
.list{padding:0 1.25rem;display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;animation:fadeUp .2s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-name{font-size:15px;font-weight:600;margin-bottom:3px}
.card-sub{font-family:var(--mono);font-size:11px;color:var(--text3)}
.card-acts{display:flex;gap:6px;flex-shrink:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:4px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.tag-ok{background:var(--green2);color:var(--green);border-color:rgba(0,230,118,.2)}
.tag-fail{background:var(--red2);color:var(--red);border-color:rgba(255,82,82,.2)}
.card-price{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--accent)}
.btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;font-family:var(--sans);color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn-del{border-color:transparent;color:var(--text3)}
.btn-del:hover{border-color:var(--red);color:var(--red);background:var(--red2)}
.empty{text-align:center;padding:4rem 1rem;color:var(--text3);font-size:14px;border:1px dashed var(--border);border-radius:var(--r);margin:0 1.25rem}

/* HISTÓRICO */
.hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem;animation:fadeUp .2s ease both}
.hist-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;align-items:flex-start}
.hist-action{font-size:13px;font-weight:500}
.hist-meta{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;line-height:1.6}
.hist-detail{font-size:12px;color:var(--text2)}
.badge{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;display:inline-block;margin-right:6px}
.badge-add{background:var(--green2);color:var(--green);border:1px solid rgba(0,230,118,.2)}
.badge-edit{background:rgba(245,197,24,.1);color:var(--accent);border:1px solid rgba(245,197,24,.2)}
.badge-del{background:var(--red2);color:var(--red);border:1px solid rgba(255,82,82,.2)}
.badge-dup{background:rgba(100,100,255,.1);color:#aaa;border:1px solid rgba(100,100,255,.2)}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:600px){.overlay{align-items:center;padding:1rem}}
.sheet{background:var(--bg2);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:1.5rem 1.25rem 2rem;width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;animation:slideUp .25s cubic-bezier(.32,1,.32,1)}
@media(min-width:600px){.sheet{border-radius:12px;animation:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.drag{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 1.25rem}
.sheet-title{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fg label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;font-family:var(--mono)}
.fg input,.fg select{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--text);font-family:var(--sans);outline:none;transition:border-color .2s;-webkit-appearance:none;width:100%}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.sim-row{display:flex;gap:8px}
.sim-btn{flex:1;padding:10px 6px;border:1px solid var(--border);border-radius:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--text3);font-family:var(--mono);transition:all .15s;user-select:none}
.sim-on{border-color:rgba(0,230,118,.4)!important;background:var(--green2)!important;color:var(--green)!important}
.sim-off{border-color:rgba(255,82,82,.4)!important;background:var(--red2)!important;color:var(--red)!important}
.sim-na{border-color:var(--border2)!important;background:var(--bg3)!important;color:var(--text3)!important}
.sheet-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)}
.btn-save{background:var(--accent);color:#000;border:none;border-radius:6px;padding:11px 22px;font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s}
.btn-save:hover{opacity:.9}
.btn-save:disabled{opacity:.5;cursor:default}
.btn-cancel{background:transparent;border:1px solid var(--border);border-radius:6px;padding:11px 18px;font-size:14px;color:var(--text2);font-family:var(--sans);cursor:pointer}
.btn-cancel:hover{background:var(--bg3)}

/* LOGIN SHEET */
.login-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.user-row{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .15s}
.user-row:hover{border-color:var(--border2)}
.user-av{width:36px;height:36px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.user-name{font-size:14px;font-weight:500}
.user-role{font-size:11px;color:var(--text3);font-family:var(--mono)}

/* PIN */
.pin-wrap{text-align:center}
.pin-back{font-size:12px;color:var(--text3);cursor:pointer;font-family:var(--mono);margin-bottom:1rem;display:inline-block}
.pin-user-label{font-size:14px;color:var(--text2);margin-bottom:1.25rem}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:1.5rem}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);transition:all .15s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.75rem}
.pin-key{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);cursor:pointer;transition:all .1s;user-select:none}
.pin-key:active{transform:scale(.93);background:var(--bg4)}
.pin-err{font-size:12px;color:var(--red);font-family:var(--mono);min-height:16px}

/* ADM SENHA */
.adm-wrap{text-align:center}
.adm-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;color:var(--text);font-family:var(--mono);outline:none;text-align:center;letter-spacing:.1em;margin-bottom:8px}
.adm-input:focus{border-color:var(--accent)}
.adm-err{font-size:12px;color:var(--red);font-family:var(--mono);min-height:16px;margin-bottom:8px}

/* GESTÃO USUARIOS */
.mgmt-row{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:calc(5rem + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:9px 18px;font-size:13px;color:var(--text);opacity:0;transition:all .25s;z-index:300;white-space:nowrap;pointer-events:none;font-family:var(--mono)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .fg.full{grid-column:1}
}
</style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <div class="loading-logo">ESTOQUE</div>
</div>

<!-- APP (sempre visível) -->
<div class="app" id="app">
  <header>
    <div class="header-inner">
      <div class="logo">📱 Estoque<small>Celulares Semi Novos</small></div>
      <div class="header-right">
        <div class="sync-dot" id="sync-dot"></div>
        <button class="btn-icon" id="btn-login" onclick="abrirLogin()">🔑 Entrar</button>
      </div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">Aparelhos</div></div>
    <div class="stat"><div class="stat-n" id="s-modelos">0</div><div class="stat-l">Modelos</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-est" onclick="setTab('est')">Estoque</button>
    <button class="tab" id="tab-hist" onclick="setTab('hist')">Histórico</button>
  </div>

  <div id="content-est">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="search" id="search" placeholder="Buscar..." oninput="renderList()">
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div id="content-hist" style="display:none;padding:.75rem 1.25rem">
    <div class="list" id="hist-list"></div>
  </div>
</div>

<button class="fab" id="fab" onclick="acaoProtegida(()=>openModal())" style="display:none">+</button>

<!-- MODAL APARELHO -->
<div class="overlay" id="ov-aparelho" onclick="bgClick(event,'ov-aparelho')">
  <div class="sheet">
    <div class="drag"></div>
    <div class="sheet-title" id="aparelho-title">// Cadastrar Aparelho</div>
    <div class="form-grid">
      <div class="fg full"><label>Nome / Modelo</label><input id="f-nome" type="text" placeholder="Ex: Samsung Galaxy A55" autocomplete="off"></div>
      <div class="fg"><label>Cor</label><input id="f-cor" type="text" placeholder="Ex: Preto" autocomplete="off"></div>
      <div class="fg"><label>Armazenamento</label>
        <select id="f-storage"><option>16 GB</option><option>32 GB</option><option>64 GB</option><option selected>128 GB</option><option>256 GB</option><option>512 GB</option><option>1 TB</option></select>
      </div>
      <div class="fg"><label>RAM</label>
        <select id="f-ram"><option>2 GB</option><option>3 GB</option><option selected>4 GB</option><option>6 GB</option><option>8 GB</option><option>12 GB</option><option>16 GB</option></select>
      </div>
      <div class="fg"><label>Valor (R$)</label><input id="f-valor" type="number" inputmode="numeric" placeholder="850"></div>
      <div class="fg"><label>Data de entrada</label><input id="f-data" type="date"></div>
      <div class="fg full"><label>SIM 1</label>
        <div class="sim-row">
          <div class="sim-btn sim-on" id="sim1-ok" onclick="setSim(1,'ok')">✓ Funcionando</div>
          <div class="sim-btn" id="sim1-fail" onclick="setSim(1,'fail')">✗ Com defeito</div>
        </div>
      </div>
      <div class="fg full"><label>SIM 2</label>
        <div class="sim-row">
          <div class="sim-btn sim-on" id="sim2-ok" onclick="setSim(2,'ok')">✓ Funcionando</div>
          <div class="sim-btn" id="sim2-fail" onclick="setSim(2,'fail')">✗ Com defeito</div>
          <div class="sim-btn" id="sim2-na" onclick="setSim(2,'na')">— Sem SIM 2</div>
        </div>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn-cancel" onclick="fechar('ov-aparelho')">Cancelar</button>
      <button class="btn-save" id="btn-save" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL LOGIN -->
<div class="overlay" id="ov-login" onclick="bgClick(event,'ov-login')">
  <div class="sheet">
    <div class="drag"></div>
    <div class="sheet-title">// Entrar</div>
    <!-- lista usuarios -->
    <div id="login-step-lista">
      <div class="login-list" id="login-lista"></div>
      <div style="text-align:center;margin-top:1rem">
        <span style="font-size:11px;color:var(--text3);font-family:var(--mono);cursor:pointer" onclick="pedirSenhaAdm(()=>abrirGerenciarUsuarios())">⚙ Gerenciar usuários</span>
      </div>
    </div>
    <!-- pin -->
    <div id="login-step-pin" style="display:none">
      <div class="pin-wrap">
        <div class="pin-back" onclick="voltarLista()">← Trocar usuário</div>
        <div class="pin-user-label" id="pin-label"></div>
        <div class="pin-dots">
          <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
          <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
        </div>
        <div class="pin-grid">
          <div class="pin-key" onclick="pinKey('1')">1</div><div class="pin-key" onclick="pinKey('2')">2</div><div class="pin-key" onclick="pinKey('3')">3</div>
          <div class="pin-key" onclick="pinKey('4')">4</div><div class="pin-key" onclick="pinKey('5')">5</div><div class="pin-key" onclick="pinKey('6')">6</div>
          <div class="pin-key" onclick="pinKey('7')">7</div><div class="pin-key" onclick="pinKey('8')">8</div><div class="pin-key" onclick="pinKey('9')">9</div>
          <div class="pin-key" style="font-size:15px;color:var(--text3)" onclick="pinDel()">⌫</div>
          <div class="pin-key" onclick="pinKey('0')">0</div>
          <div class="pin-key" style="font-size:15px;color:var(--text3)" onclick="voltarLista()">✕</div>
        </div>
        <div class="pin-err" id="pin-err"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL SENHA ADM -->
<div class="overlay" id="ov-adm" onclick="bgClick(event,'ov-adm')">
  <div class="sheet" style="max-width:360px">
    <div class="drag"></div>
    <div class="sheet-title">// Senha do Administrador</div>
    <div class="adm-wrap">
      <input class="adm-input" id="adm-input" type="password" placeholder="Digite a senha" autocomplete="off" onkeydown="if(event.key==='Enter')confirmarAdm()">
      <div class="adm-err" id="adm-err"></div>
      <div style="display:flex;gap:8px">
        <button class="btn-cancel" style="flex:1" onclick="fechar('ov-adm')">Cancelar</button>
        <button class="btn-save" style="flex:1;justify-content:center" onclick="confirmarAdm()">✓ Confirmar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL GERENCIAR USUARIOS -->
<div class="overlay" id="ov-usuarios" onclick="bgClick(event,'ov-usuarios')">
  <div class="sheet">
    <div class="drag"></div>
    <div class="sheet-title">// Usuários</div>
    <div id="mgmt-lista"></div>
    <button class="btn-save" style="width:100%;justify-content:center;margin-bottom:.75rem" onclick="abrirNovoUsuario()">+ Novo usuário</button>
    <div class="sheet-footer"><button class="btn-cancel" onclick="fechar('ov-usuarios')">Fechar</button></div>
  </div>
</div>

<!-- MODAL NOVO/EDITAR USUARIO -->
<div class="overlay" id="ov-novo-user" onclick="bgClick(event,'ov-novo-user')">
  <div class="sheet">
    <div class="drag"></div>
    <div class="sheet-title" id="novo-user-title">// Novo Usuário</div>
    <div class="fg" style="margin-bottom:12px"><label>Nome do colaborador</label><input id="nu-nome" type="text" placeholder="Ex: João" autocomplete="off"></div>
    <div class="fg" style="margin-bottom:12px"><label>Emoji</label><input id="nu-emoji" type="text" placeholder="👤" maxlength="2"></div>
    <div class="fg" style="margin-bottom:12px"><label>PIN de 4 dígitos</label><input id="nu-pin" type="password" inputmode="numeric" placeholder="••••" maxlength="4"></div>
    <div class="fg" style="margin-bottom:12px"><label>Função</label>
      <select id="nu-role"><option value="user">Colaborador</option><option value="admin">Admin</option></select>
    </div>
    <div class="sheet-footer">
      <button class="btn-cancel" onclick="fechar('ov-novo-user')">Cancelar</button>
      <button class="btn-save" onclick="salvarUsuario()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ── CONFIG FIREBASE FIXA ───────────────────────
const FB = { apiKey:'AIzaSyD6iCTPQRppW2V4TQsZj1OK7ZCysShvNN0', projectId:'sos-celulares-93e90', authDomain:'sos-celulares-93e90.firebaseapp.com' };
const ADMIN_PASS = '85086763YYgg.';

// ── STATE ──────────────────────────────────────
let db, phones=[], history=[], users=[];
let currentUser = null;
let editId = null, s1='ok', s2='ok';
let editUserId = null;
let pinBuffer = '', pinTarget = null;
let admCb = null;
let acaoPendente = null;
let activeTab = 'est';

// ── HELPERS ────────────────────────────────────
const today = () => new Date().toISOString().split('T')[0];
const fmtDate = d => { if(!d)return'—'; const[y,m,day]=d.split('-'); return`${day}/${m}/${y}`; };
const fmtTs = ts => { if(!ts)return'—'; const d=ts.toDate?ts.toDate():new Date(ts); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const fmt = v => parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
const simBadge = (l,v) => v==='ok'?`<span class="tag tag-ok">${l} ✓</span>`:v==='fail'?`<span class="tag tag-fail">${l} ✗</span>`:`<span class="tag">${l} —</span>`;
window.toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); };
const hideLoading = () => { const l=document.getElementById('loading'); l.classList.add('hidden'); setTimeout(()=>l.style.display='none',350); };
window.fechar = id => document.getElementById(id).classList.remove('open');
window.bgClick = (e,id) => { if(e.target===document.getElementById(id)) fechar(id); };

// ── FIREBASE INIT ──────────────────────────────
const app = initializeApp(FB);
db = getFirestore(app);

let phonesReady=false, histReady=false, usersReady=false;
function checkReady(){ if(phonesReady&&histReady&&usersReady){ hideLoading(); renderList(); renderHist(); } }

onSnapshot(query(collection(db,'celulares'),orderBy('ts','asc')), snap=>{
  phones=snap.docs.map(d=>({id:d.id,...d.data()}));
  updateStats(); renderList(); phonesReady=true; checkReady();
}, ()=>{ phonesReady=true; checkReady(); });

onSnapshot(query(collection(db,'historico'),orderBy('ts','desc')), snap=>{
  history=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(activeTab==='hist') renderHist(); histReady=true; checkReady();
}, ()=>{ histReady=true; checkReady(); });

onSnapshot(collection(db,'usuarios'), snap=>{
  users=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderLoginLista(); usersReady=true; checkReady();
}, ()=>{ usersReady=true; checkReady(); });

// ── STATS ──────────────────────────────────────
function updateStats(){
  document.getElementById('s-total').textContent=phones.length;
  document.getElementById('s-modelos').textContent=new Set(phones.map(p=>p.nome)).size;
}

// ── TABS ───────────────────────────────────────
window.setTab = tab => {
  activeTab=tab;
  document.getElementById('content-est').style.display=tab==='est'?'block':'none';
  document.getElementById('content-hist').style.display=tab==='hist'?'block':'none';
  document.getElementById('tab-est').classList.toggle('active',tab==='est');
  document.getElementById('tab-hist').classList.toggle('active',tab==='hist');
  document.getElementById('fab').style.display=(tab==='est'&&currentUser)?'flex':'none';
  if(tab==='hist') renderHist();
};

// ── SIM ────────────────────────────────────────
window.setSim = (n,v) => {
  if(n===1){ s1=v; document.getElementById('sim1-ok').className='sim-btn'+(v==='ok'?' sim-on':''); document.getElementById('sim1-fail').className='sim-btn'+(v==='fail'?' sim-off':''); }
  else{ s2=v; document.getElementById('sim2-ok').className='sim-btn'+(v==='ok'?' sim-on':''); document.getElementById('sim2-fail').className='sim-btn'+(v==='fail'?' sim-off':''); document.getElementById('sim2-na').className='sim-btn'+(v==='na'?' sim-na':''); }
};

// ── AÇÃO PROTEGIDA (precisa estar logado) ───────
window.acaoProtegida = cb => {
  if(currentUser){ cb(); return; }
  acaoPendente=cb;
  abrirLogin();
};

// ── LOGIN ──────────────────────────────────────
window.abrirLogin = () => {
  document.getElementById('login-step-lista').style.display='block';
  document.getElementById('login-step-pin').style.display='none';
  pinBuffer=''; pinTarget=null;
  renderLoginLista();
  document.getElementById('ov-login').classList.add('open');
};

function renderLoginLista(){
  const el=document.getElementById('login-lista');
  if(!users.length){ el.innerHTML='<div style="color:var(--text3);font-size:13px;text-align:center;padding:1rem">Nenhum usuário criado ainda.</div>'; return; }
  el.innerHTML=users.map(u=>`
    <div class="user-row" onclick="selecionarUser('${u.id}')">
      <div class="user-av">${u.emoji||'👤'}</div>
      <div><div class="user-name">${u.nome}</div><div class="user-role">${u.role==='admin'?'Admin':'Colaborador'}</div></div>
    </div>
  `).join('');
}

window.selecionarUser = id => {
  const u=users.find(x=>x.id===id); if(!u)return;
  pinTarget=u; pinBuffer='';
  document.getElementById('pin-label').textContent=(u.emoji||'👤')+' '+u.nome;
  document.getElementById('pin-err').textContent='';
  updatePinDots();
  document.getElementById('login-step-lista').style.display='none';
  document.getElementById('login-step-pin').style.display='block';
};

window.voltarLista = () => {
  document.getElementById('login-step-lista').style.display='block';
  document.getElementById('login-step-pin').style.display='none';
  pinBuffer=''; pinTarget=null;
};

window.pinKey = k => {
  if(pinBuffer.length>=4)return;
  pinBuffer+=k; updatePinDots();
  if(pinBuffer.length===4){
    setTimeout(()=>{
      if(pinBuffer===pinTarget.pin){
        currentUser=pinTarget;
        fechar('ov-login');
        atualizarHeaderLogin();
        toast('✓ Bem-vindo, '+currentUser.nome+'!');
        if(acaoPendente){ acaoPendente(); acaoPendente=null; }
      } else {
        document.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('error'));
        document.getElementById('pin-err').textContent='PIN incorreto';
        setTimeout(()=>{ pinBuffer=''; updatePinDots(); document.getElementById('pin-err').textContent=''; },700);
      }
    },100);
  }
};

window.pinDel = () => { pinBuffer=pinBuffer.slice(0,-1); updatePinDots(); };

function updatePinDots(){
  for(let i=0;i<4;i++){
    const d=document.getElementById('pd'+i);
    d.classList.remove('filled','error');
    if(i<pinBuffer.length)d.classList.add('filled');
  }
}

function atualizarHeaderLogin(){
  const btn=document.getElementById('btn-login');
  if(currentUser){
    btn.textContent=(currentUser.emoji||'👤')+' '+currentUser.nome;
    btn.classList.add('logado');
    btn.onclick=abrirMenuUsuario;
    if(activeTab==='est') document.getElementById('fab').style.display='flex';
  } else {
    btn.textContent='🔑 Entrar';
    btn.classList.remove('logado');
    btn.onclick=abrirLogin;
    document.getElementById('fab').style.display='none';
  }
}

// ── MENU USUÁRIO LOGADO ────────────────────────
function abrirMenuUsuario(){
  const opcoes = [
    {label:'🔒 Alterar meu PIN', fn:()=>pedirSenhaAdm(()=>pedirNovoPin())},
    {label:'⎋ Sair', fn:()=>{ currentUser=null; atualizarHeaderLogin(); toast('Saiu da conta'); }}
  ];
  // abre sheet simples
  const sheet = document.createElement('div');
  sheet.innerHTML=`<div class="overlay open" id="ov-menu" onclick="if(event.target===this)this.remove()"><div class="sheet" style="max-width:340px"><div class="drag"></div><div class="sheet-title">// ${currentUser.nome}</div>${opcoes.map((o,i)=>`<div class="mgmt-row" style="cursor:pointer;margin-bottom:0" onclick="document.getElementById('ov-menu').remove();(${o.fn.toString()})()">${o.label}</div>`).join('')}<div class="sheet-footer"><button class="btn-cancel" onclick="document.getElementById('ov-menu').remove()">Fechar</button></div></div></div>`;
  document.body.appendChild(sheet.firstChild);
}

// ── ALTERAR PIN ────────────────────────────────
function pedirNovoPin(){
  // reutiliza modal adm para digitar novo pin
  document.getElementById('adm-input').type='tel';
  document.getElementById('adm-input').maxLength=4;
  document.getElementById('adm-input').placeholder='Novo PIN de 4 dígitos';
  document.getElementById('adm-input').value='';
  document.getElementById('adm-err').textContent='';
  admCb = async () => {
    const pin=document.getElementById('adm-input').value.trim();
    if(pin.length!==4||isNaN(pin)){ document.getElementById('adm-err').textContent='PIN deve ter 4 números'; return false; }
    await updateDoc(doc(db,'usuarios',currentUser.id),{pin});
    currentUser.pin=pin;
    toast('✓ PIN alterado'); return true;
  };
  document.getElementById('ov-adm').classList.add('open');
  setTimeout(()=>{ document.getElementById('adm-input').type='password'; document.getElementById('adm-input').focus(); },200);
}

// ── SENHA ADM ──────────────────────────────────
window.pedirSenhaAdm = cb => {
  admCb=null;
  document.getElementById('adm-input').type='password';
  document.getElementById('adm-input').maxLength=50;
  document.getElementById('adm-input').placeholder='Digite a senha do administrador';
  document.getElementById('adm-input').value='';
  document.getElementById('adm-err').textContent='';
  admCb=cb;
  document.getElementById('ov-adm').classList.add('open');
  setTimeout(()=>document.getElementById('adm-input').focus(),200);
};

window.confirmarAdm = async () => {
  const val=document.getElementById('adm-input').value;
  if(val===ADMIN_PASS||admCb===pedirNovoPin){
    if(val===ADMIN_PASS||document.getElementById('adm-input').placeholder.includes('administrador')){
      if(val!==ADMIN_PASS){ document.getElementById('adm-err').textContent='Senha incorreta'; return; }
    }
    fechar('ov-adm');
    if(admCb){ const ok=await admCb(); if(ok===false) document.getElementById('ov-adm').classList.add('open'); admCb=null; }
  } else {
    document.getElementById('adm-err').textContent='Senha incorreta';
    document.getElementById('adm-input').value='';
    document.getElementById('adm-input').focus();
  }
};

// ── GESTÃO DE USUARIOS ─────────────────────────
window.abrirGerenciarUsuarios = () => {
  fechar('ov-login');
  renderMgmt();
  document.getElementById('ov-usuarios').classList.add('open');
};

function renderMgmt(){
  const el=document.getElementById('mgmt-lista');
  if(!users.length){ el.innerHTML='<div style="color:var(--text3);font-size:13px;margin-bottom:1rem">Nenhum usuário.</div>'; return; }
  el.innerHTML=users.map(u=>`
    <div class="mgmt-row">
      <div style="font-size:22px">${u.emoji||'👤'}</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:500">${u.nome}</div><div style="font-size:11px;color:var(--text3);font-family:var(--mono)">${u.role==='admin'?'Admin':'Colaborador'} · PIN: ${u.pin}</div></div>
      <button class="btn" style="padding:5px 10px;font-size:11px" onclick="pedirSenhaAdm(()=>editarUsuario('${u.id}'))">✏️</button>
      <button class="btn btn-del" style="padding:5px 10px;font-size:11px" onclick="pedirSenhaAdm(()=>deletarUsuario('${u.id}'))">🗑</button>
    </div>
  `).join('');
}

window.abrirNovoUsuario = () => {
  pedirSenhaAdm(()=>{
    editUserId=null;
    document.getElementById('novo-user-title').textContent='// Novo Usuário';
    document.getElementById('nu-nome').value='';
    document.getElementById('nu-emoji').value='👤';
    document.getElementById('nu-pin').value='';
    document.getElementById('nu-role').value='user';
    document.getElementById('ov-novo-user').classList.add('open');
  });
};

window.editarUsuario = id => {
  const u=users.find(x=>x.id===id); if(!u)return;
  editUserId=id;
  document.getElementById('novo-user-title').textContent='// Editar Usuário';
  document.getElementById('nu-nome').value=u.nome;
  document.getElementById('nu-emoji').value=u.emoji||'👤';
  document.getElementById('nu-pin').value=u.pin;
  document.getElementById('nu-role').value=u.role||'user';
  document.getElementById('ov-novo-user').classList.add('open');
};

window.salvarUsuario = async () => {
  const nome=document.getElementById('nu-nome').value.trim();
  const emoji=document.getElementById('nu-emoji').value.trim()||'👤';
  const pin=document.getElementById('nu-pin').value.trim();
  const role=document.getElementById('nu-role').value;
  if(!nome){ toast('Informe o nome'); return; }
  if(pin.length!==4||isNaN(pin)){ toast('PIN deve ter 4 números'); return; }
  if(editUserId){ await updateDoc(doc(db,'usuarios',editUserId),{nome,emoji,pin,role}); toast('✓ Usuário atualizado'); }
  else { await addDoc(collection(db,'usuarios'),{nome,emoji,pin,role,ts:serverTimestamp()}); toast('✓ Usuário criado'); }
  fechar('ov-novo-user');
  renderMgmt();
};

window.deletarUsuario = async id => {
  if(!confirm('Excluir este usuário?'))return;
  await deleteDoc(doc(db,'usuarios',id));
  toast('Usuário removido'); renderMgmt();
};

// ── HISTÓRICO ──────────────────────────────────
async function registrar(acao,aparelho,detalhe=''){
  try{ await addDoc(collection(db,'historico'),{ acao,aparelho,detalhe, usuario:currentUser?.nome||'—', usuarioEmoji:currentUser?.emoji||'👤', ts:serverTimestamp() }); }catch(e){}
}

function renderHist(){
  const el=document.getElementById('hist-list');
  if(!history.length){ el.innerHTML='<div class="empty">Nenhuma alteração registrada.</div>'; return; }
  el.innerHTML=history.map((h,i)=>{
    const bc=h.acao==='Cadastro'?'badge-add':h.acao==='Edição'?'badge-edit':h.acao==='Duplicado'?'badge-dup':'badge-del';
    return `<div class="hist-item" style="animation-delay:${i*25}ms">
      <div class="hist-top">
        <div class="hist-action"><span class="badge ${bc}">${h.acao}</span>${h.aparelho||''}</div>
        <div class="hist-meta">${h.usuarioEmoji||'👤'} ${h.usuario||'—'}<br>${fmtTs(h.ts)}</div>
      </div>
      ${h.detalhe?`<div class="hist-detail">${h.detalhe}</div>`:''}
    </div>`;
  }).join('');
}

// ── MODAL APARELHO ─────────────────────────────
window.openModal = id => {
  editId=id||null; s1='ok'; s2='ok';
  const p=id?phones.find(x=>x.id===id):null;
  document.getElementById('aparelho-title').textContent=id?'// Editar Aparelho':'// Cadastrar Aparelho';
  document.getElementById('f-nome').value=p?.nome||'';
  document.getElementById('f-cor').value=p?.cor||'';
  document.getElementById('f-storage').value=p?.storage||'128 GB';
  document.getElementById('f-ram').value=p?.ram||'4 GB';
  document.getElementById('f-valor').value=p?.valor||'';
  document.getElementById('f-data').value=p?.data||today();
  if(p){ s1=p.sim1||'ok'; s2=p.sim2||'ok'; }
  setSim(1,s1); setSim(2,s2);
  document.getElementById('ov-aparelho').classList.add('open');
};

window.salvar = async () => {
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome){ toast('Informe o nome'); return; }
  const btn=document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='Salvando...';
  const data={nome,cor:document.getElementById('f-cor').value.trim(),storage:document.getElementById('f-storage').value,ram:document.getElementById('f-ram').value,valor:document.getElementById('f-valor').value,data:document.getElementById('f-data').value,sim1:s1,sim2:s2};
  try{
    if(editId){
      const old=phones.find(x=>x.id===editId);
      await updateDoc(doc(db,'celulares',editId),data);
      const diffs=[];
      if(old.nome!==data.nome)diffs.push(`Nome: ${old.nome}→${data.nome}`);
      if(old.cor!==data.cor)diffs.push(`Cor: ${old.cor}→${data.cor}`);
      if(old.storage!==data.storage)diffs.push(`Storage: ${old.storage}→${data.storage}`);
      if(old.ram!==data.ram)diffs.push(`RAM: ${old.ram}→${data.ram}`);
      if(old.valor!==data.valor)diffs.push(`Valor: R$${fmt(old.valor)}→R$${fmt(data.valor)}`);
      await registrar('Edição',data.nome,diffs.length?diffs.join(' | '):'—');
      toast('✓ Atualizado');
    } else {
      await addDoc(collection(db,'celulares'),{...data,ts:serverTimestamp()});
      await registrar('Cadastro',data.nome,`${data.storage} · ${data.ram} · R$${fmt(data.valor)}`);
      toast('✓ Cadastrado');
    }
    fechar('ov-aparelho');
  }catch(e){ toast('Erro ao salvar'); }
  btn.disabled=false; btn.innerHTML='💾 Salvar';
};

window.excluir = id => {
  acaoProtegida(()=>{
    const p=phones.find(x=>x.id===id);
    if(!confirm('Excluir '+p?.nome+'?'))return;
    deleteDoc(doc(db,'celulares',id));
    registrar('Exclusão',p?.nome||id,`${p?.storage}·${p?.ram}·R$${fmt(p?.valor)}`);
    toast('Removido');
  });
};

window.duplicar = id => {
  acaoProtegida(async ()=>{
    const p=phones.find(x=>x.id===id); if(!p)return;
    await addDoc(collection(db,'celulares'),{nome:p.nome,cor:p.cor,storage:p.storage,ram:p.ram,valor:p.valor,data:today(),sim1:p.sim1,sim2:p.sim2,ts:serverTimestamp()});
    await registrar('Duplicado',p.nome,`Cópia de ${p.nome}`);
    toast('✓ Duplicado');
  });
};

// ── RENDER LIST ────────────────────────────────
window.renderList = () => {
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  const el=document.getElementById('list');
  const f=phones.filter(p=>!q||p.nome?.toLowerCase().includes(q)||(p.cor||'').toLowerCase().includes(q));
  if(!f.length){ el.innerHTML=`<div class="empty">${phones.length?'Nenhum resultado.':'Nenhum aparelho cadastrado ainda.'}</div>`; return; }
  el.innerHTML=f.map((p,i)=>`
    <div class="card" style="animation-delay:${i*35}ms">
      <div class="card-top">
        <div>
          <div class="card-name">${p.nome}</div>
          <div class="card-sub">${p.cor||'—'} · ${fmtDate(p.data)}</div>
        </div>
        <div class="card-acts" id="acts-${p.id}">
          ${currentUser?`
            <button class="btn" onclick="acaoProtegida(()=>openModal('${p.id}'))">✏️</button>
            <button class="btn" onclick="duplicar('${p.id}')" title="Duplicar">⧉</button>
            <button class="btn btn-del" onclick="excluir('${p.id}')">🗑</button>
          `:''}
        </div>
      </div>
      <div class="tags">
        <span class="tag">💾 ${p.storage}</span>
        <span class="tag">⚡ ${p.ram} RAM</span>
        ${simBadge('SIM1',p.sim1)}${simBadge('SIM2',p.sim2)}
      </div>
      <div class="card-price">R$ ${fmt(p.valor)}</div>
    </div>
  `).join('');
};

// ── BOOT ──────────────────────────────────────
// Limpa SW antigo
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(r=>r.forEach(sw=>sw.unregister()));
  caches.keys().then(k=>k.forEach(c=>caches.delete(c)));
}
</script>
</body>
</html>
